# Publishes @coalescence-labs/design to npm with trusted publishing (OIDC): no npm token is stored.
# Release: bump llm/design/package.json "version", merge, then push a tag `design-v<version>`.
# One-time setup on npmjs.com (package settings → Trusted publisher): GitHub Actions,
# repository Alexjoshua14/Organic-LLM, workflow design-publish.yml.
name: design-publish

on:
  push:
    tags:
      - "design-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm/design

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "design-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Install, typecheck and build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm publish --access public
