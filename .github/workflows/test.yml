name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a branch be tested on the Linux runner without opening a PR to main.
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  unit-and-integration:
    name: Unit & integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        # Console output stays on in CI: some failures only reproduce on the Linux runner's file order.
        env:
          TEST_VERBOSE: "1"
        run: bun run test

  memory-feedback-database:
    name: Memory feedback grants and migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise migrations, votes, sharing, and ownership in disposable Postgres
        run: bash scripts/test-memory-feedback-db.sh
