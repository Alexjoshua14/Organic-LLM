[package]
name = "organic-lumen-raycaster"
version = "0.1.0"
edition = "2021"
description = "Dependency-free 2D Signed-Distance Field (SDF) + single-bounce character lumen raycaster for Organic LLM"
license = "MIT"

[lib]
name = "organic_lumen_raycaster"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
